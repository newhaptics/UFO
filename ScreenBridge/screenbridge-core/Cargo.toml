[package]
name = "screenbridge-core"
version = "0.1.0"
edition = "2021"
authors = ["ScreenBridge Contributors"]
description = "Rust library for Microsoft Word UI automation via Windows UI Automation"
license = "MIT"
repository = "https://github.com/microsoft/UFO"
keywords = ["windows", "ui-automation", "word", "accessibility"]
categories = ["api-bindings", "os::windows-apis"]

[dependencies]
# Windows UI Automation API
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }
windows-core = "0.58"

# Error handling
thiserror = "2.0"

# Serialization (for MCP compatibility later)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# Testing utilities
pretty_assertions = "1.4"
